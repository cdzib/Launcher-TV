<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV Launcher · Prototipo Hub de Ajustes</title>
<style>
  :root{
    --bg:#07060b; --bg2:#171122; --surface:#211a2b; --surface-hi:#2b2239; --surface-low:#1a1524;
    --accent:#37d9c5; --text:#f2f4f7; --muted:#b4bcc8; --dim:#7c8695;
    --blue:#8ab4f8; --purple:#bb86fc; --amber:#ffb74d; --green:#7ed9a0; --red:#ff8a80;
    --radius-panel:28px; --radius-card:24px; --radius-row:18px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;overflow:hidden}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  .bar{position:fixed;inset:0 0 auto 0;height:64px;z-index:100;display:flex;align-items:center;gap:18px;
    padding:0 20px;background:rgba(14,12,20,.92);border-bottom:1px solid #ffffff12;backdrop-filter:blur(12px)}
  .brand{font-size:14px;font-weight:600;letter-spacing:.2px;white-space:nowrap}
  .brand span{color:var(--dim);font-weight:400}
  .bar__group{display:flex;align-items:center;gap:8px;padding-left:18px;border-left:1px solid #ffffff12}
  .bar__label{font-size:12px;color:var(--dim)}
  .pill{height:32px;padding:0 14px;border-radius:16px;background:#ffffff0d;font-size:13px;font-weight:500;
    display:inline-flex;align-items:center;gap:8px;transition:box-shadow .15s}
  .pill:hover{background:#ffffff17}
  .pill.on{background:var(--accent);color:#08110f;font-weight:600}
  .pill svg{width:15px;height:15px}
  select{height:32px;border-radius:16px;background:#ffffff0d;color:var(--text);border:1px solid #ffffff14;
    padding:0 10px;font-size:13px;outline:none}
  .swatches{display:flex;gap:6px}
  .swatch{width:24px;height:24px;border-radius:50%;border:2px solid transparent;transition:transform .15s}
  .swatch:hover{transform:scale(1.12)}
  .swatch.on{border-color:#fff;box-shadow:0 0 0 2px #000}
  .check{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
  .check input{accent-color:var(--accent);width:15px;height:15px}
  .spacer{flex:1}
  .help{width:32px;height:32px;border-radius:50%;background:#ffffff0d;display:grid;place-items:center;font-weight:700;color:var(--muted)}
  .help:hover{background:#ffffff17;color:#fff}

  .stage{position:fixed;inset:64px 0 0 0;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .scaler{width:1920px;height:1080px;transform-origin:center center;flex:none}

  .tv{position:relative;width:1920px;height:1080px;overflow:hidden;border-radius:10px;
    background:
      radial-gradient(900px 520px at 82% 8%, #241a3d 0%, transparent 62%),
      linear-gradient(180deg,#0a0910 0%,#171122 100%);
    box-shadow:0 30px 90px rgba(0,0,0,.65), 0 0 0 1px #ffffff0d}

  /* ---------- topbar ---------- */
  .tv-title{position:absolute;left:64px;top:34px;font-size:46px;font-weight:700;letter-spacing:-.6px}
  .tv-sub{position:absolute;left:64px;top:106px;font-size:19px;color:var(--muted)}
  .device{position:absolute;left:1310px;top:52px;width:302px;height:52px;border-radius:26px;background:var(--surface);
    display:flex;align-items:center;gap:10px;padding:0 20px;font-size:15px;font-weight:500}
  .device i{width:10px;height:10px;border-radius:50%;background:var(--green);flex:none}
  .closebtn{position:absolute;left:1640px;top:52px;width:216px;height:52px;border-radius:26px;background:var(--surface);
    display:flex;align-items:center;gap:12px;padding:0 22px;font-size:17px;font-weight:600;transition:background .15s}
  .closebtn:hover{background:var(--surface-hi)}
  .ico{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

  /* ---------- rail ---------- */
  .rail{position:absolute;left:64px;top:196px;width:300px;height:620px;border-radius:var(--radius-panel);
    background:var(--surface-low);padding:24px 16px;display:flex;flex-direction:column;gap:8px}
  .rail-item{position:relative;height:64px;border-radius:18px;display:flex;align-items:center;gap:16px;padding:0 20px;
    color:var(--muted);font-size:17px;transition:background .15s,color .15s,box-shadow .15s;text-align:left;width:100%}
  .rail-item .ico{color:currentColor}
  .rail-item:hover{background:#ffffff08;color:var(--text)}
  .rail-item.sel{background:var(--surface-hi);color:var(--text);font-weight:600}
  .rail-item.sel::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:5px;border-radius:3px;background:var(--accent)}
  .rail-item.foc{box-shadow:inset 0 0 0 3px var(--accent)}
  .rail-badge{margin-left:auto;font-size:11px;font-weight:700;letter-spacing:.4px;color:var(--amber);
    background:color-mix(in srgb,var(--amber) 18%,transparent);padding:5px 10px;border-radius:12px}
  .rail-version{position:absolute;left:92px;top:836px;font-size:13px;color:var(--dim)}

  /* ---------- content ---------- */
  .content{position:absolute;left:400px;top:200px;width:1456px;bottom:80px;transition:opacity .18s}
  .view-in{animation:viewIn .22s cubic-bezier(.2,0,0,1)}
  @keyframes viewIn{from{transform:translateY(8px)}to{transform:none}}

  .chips{display:flex;gap:24px}
  .chip{height:48px;border-radius:24px;background:var(--surface);display:flex;align-items:center;gap:14px;
    padding:0 20px;font-size:15px;font-weight:500;color:var(--text);min-width:0}
  .chip .ico{width:20px;height:20px}
  .chip small{color:var(--muted);font-weight:400}

  .section{display:flex;align-items:center;gap:10px;margin:36px 0 16px;font-size:13px;font-weight:600;
    letter-spacing:1.7px;color:var(--dim);text-transform:uppercase}
  .section .line{height:1px;background:#ffffff0d;flex:1}

  .grid-sys{display:grid;grid-template-columns:repeat(2,716px);gap:24px}
  .grid-own{display:grid;grid-template-columns:repeat(3,468px);gap:24px}
  .card{position:relative;height:168px;border-radius:var(--radius-card);background:var(--surface);
    display:flex;align-items:center;gap:24px;padding:0 28px;cursor:pointer;text-align:left;width:100%;
    transition:background .16s,transform .16s,box-shadow .16s}
  .grid-own .card{height:160px}
  .card:hover{background:var(--surface-hi)}
  .card.foc{background:var(--surface-hi);box-shadow:0 0 0 3px var(--accent);transform:scale(1.02)}
  .card .icbox{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;flex:none}
  .card .icbox .ico{width:28px;height:28px}
  .card h3{margin:0;font-size:22px;font-weight:600;line-height:1.25}
  .card p{margin:7px 0 0;font-size:15px;color:var(--muted);line-height:1.35}
  .card .b{position:absolute;right:28px;top:28px}
  .card .chev{position:absolute;right:22px;top:50%;transform:translateY(-50%);color:var(--dim)}
  .card.foc .chev{color:var(--accent)}

  .badge{font-size:11px;font-weight:700;letter-spacing:.5px;padding:6px 11px;border-radius:12px;white-space:nowrap}
  .badge.OWN{color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,transparent)}
  .badge.SISTEMA{color:var(--blue);background:color-mix(in srgb,var(--blue) 16%,transparent)}
  .badge.SHIZUKU{color:var(--purple);background:color-mix(in srgb,var(--purple) 16%,transparent)}
  .badge.OEM{color:var(--amber);background:color-mix(in srgb,var(--amber) 16%,transparent)}

  /* ---------- list rows ---------- */
  .cat{display:flex;gap:0}
  .list{width:880px;flex:none}
  .row{position:relative;width:100%;height:76px;border-radius:var(--radius-row);background:var(--surface);
    display:flex;align-items:center;gap:20px;padding:0 20px;cursor:pointer;text-align:left;margin-bottom:8px;
    transition:background .16s,box-shadow .16s}
  .row:hover{background:var(--surface-hi)}
  .row.foc{background:var(--surface-hi);box-shadow:0 0 0 3px var(--accent)}
  .row .icbox{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex:none}
  .row .icbox .ico{width:20px;height:20px}
  .row h4{margin:0;font-size:18px;font-weight:600}
  .row p{margin:4px 0 0;font-size:13px;color:var(--muted)}
  .row .b{position:absolute;right:58px;top:26px}
  .row .chev{position:absolute;right:18px;top:50%;transform:translateY(-50%);color:var(--dim)}
  .row.foc .chev{color:var(--accent)}
  .note{font-size:13px;color:var(--dim);margin-top:10px;line-height:1.4;max-width:820px}

  /* ---------- detail ---------- */
  .detail{position:absolute;left:1320px;top:200px;width:536px;height:700px;border-radius:var(--radius-panel);
    background:var(--surface);padding:32px;display:flex;flex-direction:column}
  .detail .icbox{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;margin-bottom:20px}
  .detail .icbox .ico{width:26px;height:26px}
  .detail h3{margin:0;font-size:30px;font-weight:700;line-height:1.18;letter-spacing:-.3px}
  .detail .b{margin-top:12px;align-self:flex-start}
  .detail .desc{margin:16px 0 0;font-size:16px;line-height:1.45;color:var(--muted)}
  .detail .rule{height:1px;background:#ffffff12;margin:24px 0}
  .detail .kicker{font-size:12px;font-weight:600;letter-spacing:1.3px;color:var(--dim);text-transform:uppercase;margin-bottom:12px}
  .kv{display:flex;justify-content:space-between;gap:18px;font-size:15px;line-height:1.9}
  .kv span:first-child{color:var(--muted)}
  .kv span:last-child{font-weight:600}
  .bullets{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
  .bullets li{position:relative;padding-left:20px;font-size:15px;line-height:1.35}
  .bullets li::before{content:"";position:absolute;left:0;top:7px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
  .detail .grow{flex:1}
  .btn{height:56px;border-radius:28px;display:flex;align-items:center;justify-content:center;font-size:17px;
    font-weight:600;transition:box-shadow .15s,transform .15s,background .15s;width:100%}
  .btn.primary{background:var(--accent);color:#08110f}
  .btn.primary:hover{filter:brightness(1.06)}
  .btn.primary.foc{box-shadow:0 0 0 3px #fff, 0 0 0 7px color-mix(in srgb,var(--accent) 55%,transparent)}
  .btn.ghost{border:1.5px solid #ffffff36;color:var(--text);height:52px;margin-top:12px}
  .btn.ghost.foc{box-shadow:0 0 0 3px var(--accent)}
  .detail .hintline{margin-top:16px;text-align:center;font-size:14px;color:var(--dim)}

  /* ---------- footer / specs ---------- */
  .hint{position:absolute;right:64px;bottom:34px;font-size:15px;color:var(--dim)}
  .foot{position:absolute;left:64px;bottom:34px;display:flex;align-items:center;gap:10px;font-size:14px;color:var(--dim)}
  .foot i{width:9px;height:9px;border-radius:50%;background:var(--green)}

  .specs{position:absolute;inset:0;z-index:40;pointer-events:none;display:none}
  .specs.show{display:block}
  .spec{position:absolute;border:1px dashed color-mix(in srgb,var(--accent) 75%,transparent);border-radius:6px}
  .spec b{position:absolute;top:-13px;left:8px;background:#07110f;color:var(--accent);font-size:11px;font-weight:700;
    letter-spacing:.4px;padding:2px 7px;border-radius:6px;white-space:nowrap}

  /* ---------- modal ---------- */
  .modal-layer{position:absolute;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
    background:rgba(4,3,8,.62);backdrop-filter:blur(7px)}
  .modal-layer.open{display:flex}
  .modal{width:980px;max-height:760px;background:#171220;border:1px solid #ffffff14;border-radius:28px;
    box-shadow:0 40px 100px rgba(0,0,0,.7);display:flex;flex-direction:column;overflow:hidden;
    animation:modalIn .24s cubic-bezier(.2,0,0,1)}
  @keyframes modalIn{from{transform:translateY(14px) scale(.985)}to{transform:none}}
  .modal.wide{width:1120px}
  .modal-head{display:flex;align-items:center;gap:18px;padding:26px 32px;border-bottom:1px solid #ffffff10}
  .modal-head .icbox{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex:none}
  .modal-head h2{margin:0;font-size:24px;font-weight:700}
  .modal-head p{margin:4px 0 0;font-size:14px;color:var(--muted)}
  .modal-head .x{margin-left:auto;color:var(--dim);padding:8px}
  .modal-body{padding:26px 32px;overflow:auto}
  .modal-foot{padding:20px 32px 26px;display:flex;gap:14px;justify-content:flex-end;border-top:1px solid #ffffff10}
  .modal-foot .btn{width:auto;padding:0 28px;min-width:180px}
  .sysrow{display:flex;align-items:center;gap:18px;padding:16px 8px;border-bottom:1px solid #ffffff0a;font-size:17px}
  .sysrow .ico{color:var(--muted)}
  .sysrow b{margin-left:auto;font-size:14px;color:var(--muted);font-weight:500}
  .code{background:#0d0a14;border:1px solid #ffffff12;border-radius:14px;padding:18px 20px;margin-top:12px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;line-height:1.7;color:#cfe9e4;white-space:pre-wrap}
  .sliderbox{margin-top:18px}
  .sliderbox label{display:flex;justify-content:space-between;font-size:15px;color:var(--muted);margin-bottom:10px}
  .sliderbox b{color:var(--text)}
  input[type=range]{width:100%;accent-color:var(--amber)}
  .notice{background:#ffffff08;border:1px solid #ffffff10;border-radius:16px;padding:16px 18px;font-size:14px;
    color:var(--muted);line-height:1.5;margin-top:16px}
  .warnline{color:var(--amber)}

  /* ---------- toast ---------- */
  .toast{position:absolute;left:50%;bottom:76px;transform:translate(-50%,14px);opacity:0;z-index:80;
    background:#e9fffb;color:#06201c;padding:14px 24px;border-radius:16px;font-size:15px;font-weight:600;
    box-shadow:0 16px 40px rgba(0,0,0,.45);transition:opacity .2s,transform .2s;pointer-events:none}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .hidden{display:none!important}
</style>
</head>
<body>

<header class="bar">
  <div class="brand">TV Launcher <span>· Prototipo Hub de Ajustes</span></div>
  <div class="bar__group">
    <span class="bar__label">Vistas</span>
    <button class="pill" data-view="0">Inicio</button>
    <button class="pill" data-view="1">Pantalla</button>
    <button class="pill" data-view="6">Proyector</button>
  </div>
  <div class="bar__group">
    <span class="bar__label">Shizuku</span>
    <select id="shizukuSel">
      <option value="connected">Conectado</option>
      <option value="unauthorized">Sin autorizar</option>
      <option value="missing">No instalado</option>
    </select>
  </div>
  <div class="bar__group">
    <label class="check"><input type="checkbox" id="oemToggle" checked> App OEM del proyector</label>
    <label class="check"><input type="checkbox" id="specsToggle"> Especificaciones</label>
  </div>
  <div class="bar__group">
    <span class="bar__label">Acento</span>
    <div class="swatches" id="swatches"></div>
  </div>
  <div class="spacer"></div>
  <button class="help" id="helpBtn" title="Ayuda">?</button>
</header>

<main class="stage" id="stage">
  <div class="scaler" id="scaler">
    <div class="tv" id="tv">
      <div class="tv-title">Ajustes</div>
      <div class="tv-sub" id="subtitle"></div>
      <div class="device"><i></i>Wanbo T6 Max · Android 9</div>
      <button class="closebtn" id="closeBtn">
        <svg class="ico" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg> Cerrar
      </button>

      <aside class="rail" id="rail"></aside>
      <div class="rail-version">TV Launcher · 1.0</div>

      <section class="content" id="content"></section>
      <aside class="detail hidden" id="detail"></aside>

      <div class="foot"><i></i><span id="footText">Shizuku conectado · 3 operaciones disponibles</span></div>
      <div class="hint">OK abrir · Atrás volver</div>

      <div class="specs" id="specs"></div>

      <div class="modal-layer" id="modalLayer"><div class="modal" id="modal"></div></div>
      <div class="toast" id="toast"></div>
    </div>
  </div>
</main>

<script>
/* ------------------------------------------------------------------ */
/*  Iconos (trazo, 24×24)                                             */
/* ------------------------------------------------------------------ */
const ICONS = {
  house:'<path d="M3 9.5 12 3l9 6.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',
  display:'<rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>',
  wifi:'<path d="M5 12.5a11 11 0 0 1 14 0"/><path d="M1.5 9a16 16 0 0 1 21 0"/><path d="M8.5 16a6 6 0 0 1 7 0"/><circle cx="12" cy="20" r="1"/>',
  radio:'<circle cx="12" cy="12" r="2"/><path d="M7.8 7.8a6 6 0 0 0 0 8.4M16.2 16.2a6 6 0 0 0 0-8.4M4.9 4.9a10 10 0 0 0 0 14.2M19.1 19.1a10 10 0 0 0 0-14.2"/>',
  grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/>',
  gear:'<path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2.2"/><circle cx="15" cy="12" r="2.2"/><circle cx="8" cy="18" r="2.2"/>',
  tv:'<rect x="2" y="7" width="20" height="14" rx="2"/><path d="m17 2-5 5-5-5"/>',
  tool:'<path d="M14.7 6.3a4 4 0 0 0 5 5l-9.4 9.4a2.1 2.1 0 0 1-3-3z"/><path d="M14.7 6.3 18 3a4 4 0 0 1 3 3l-3.3 3.3"/>',
  chev:'<path d="m9 18 6-6-6-6"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/>',
  bolt:'<path d="M13 2 3 14h9l-1 8 10-12h-9z"/>',
  trash:'<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/><path d="M10 11v5M14 11v5"/>',
  refresh:'<path d="M3 12a9 9 0 0 1 15.5-6.4L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.4L3 16"/><path d="M3 21v-5h5"/>',
  image:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/>',
  speaker:'<path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/>',
  cable:'<path d="M4 4v6a2 2 0 0 0 2 2h2"/><rect x="8" y="10" width="8" height="6" rx="1"/><path d="M16 12h4v4a2 2 0 0 1-2 2h-2"/>',
  palette:'<path d="M12 3a9 9 0 1 0 0 18c1 0 1.5-.7 1.5-1.5 0-.4-.2-.8-.5-1.1-.3-.3-.5-.7-.5-1.1 0-.8.7-1.3 1.5-1.3H16a5 5 0 0 0 5-5c0-4.4-4-8-9-8z"/><circle cx="7.5" cy="11.5" r="1"/><circle cx="12" cy="7.5" r="1"/><circle cx="16.5" cy="11.5" r="1"/>',
  cloud:'<path d="M17.5 19a4.5 4.5 0 0 0 .5-9 6 6 0 0 0-11.6-1.6A4 4 0 0 0 6.5 19z"/>',
  star:'<path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9z"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
  aspect:'<rect x="2" y="6" width="20" height="12" rx="2"/><path d="M7 10h3M7 10v4M17 14h-3M17 14v-4"/>',
  scope:'<circle cx="12" cy="12" r="7"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/>',
  zoom:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M8 11h6M11 8v6"/>',
  back:'<path d="m15 18-6-6 6-6"/>',
  check:'<path d="m5 13 4 4L19 7"/>',
  copy:'<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/>',
  drive:'<rect x="2" y="14" width="20" height="6" rx="2"/><path d="M6 14V8a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v6M6 20v2M18 20v2"/>',
  bt:'<path d="m7 7 10 10-5 5V2l5 5L7 17"/>'
};
const ico = (n, cls='') => `<svg class="ico ${cls}" viewBox="0 0 24 24">${ICONS[n]||ICONS.info}</svg>`;

/* ------------------------------------------------------------------ */
/*  Datos                                                             */
/* ------------------------------------------------------------------ */
const OWN='PROPIO', SYS='SISTEMA', SHI='SHIZUKU', OEM='OEM';
const C = { OWN:'var(--accent)', SYS:'var(--blue)', SHI:'var(--purple)', OEM:'var(--amber)' };

/* ------------------------------------------------------------------ */
/*  Estado                                                            */
/* ------------------------------------------------------------------ */
const state = {
  category:0, zone:'rail', railIndex:0, contentIndex:0, detailIndex:0,
  shizuku:'connected', oem:true, applied:false, specs:false,
  accent:'#37d9c5', modal:null, rows:[], actions:[]
};

const $ = s => document.querySelector(s);
const tv = $('#tv'), railEl = $('#rail'), contentEl = $('#content'), detailEl = $('#detail');
const subtitleEl = $('#subtitle'), specsEl = $('#specs'), modalLayer = $('#modalLayer'), modalEl = $('#modal');
let toastTimer = null;

/* ------------------------------------------------------------------ */
/*  Utilidades                                                        */
/* ------------------------------------------------------------------ */
function badge(origin){ return `<span class="badge ${origin}">${origin}</span>`; }
function shizukuLabel(){
  return state.shizuku==='connected' ? 'Conectado' : state.shizuku==='unauthorized' ? 'Sin autorizar' : 'No instalado';
}
function shizukuColor(){
  return state.shizuku==='connected' ? 'var(--purple)' : 'var(--red)';
}
function setAccent(hex, el){
  state.accent = hex;
  tv.style.setProperty('--accent', hex);
  document.querySelectorAll('.swatch').forEach(s=>s.classList.toggle('on', s.dataset.hex===hex));
  if(el) el.blur();
}
function showToast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('show'), 2400);
}
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ------------------------------------------------------------------ */
/*  Render                                                            */
/* ------------------------------------------------------------------ */
function render(){
  const cat = CATS[state.category];
  subtitleEl.textContent = state.category===0
    ? 'Sistema, pantalla y proyector en un solo lugar'
    : 'Ajustes  /  ' + cat.label;

  renderRail();
  state.railIndex = state.category;
  detailEl.classList.add('hidden');

  if(state.category===0) renderHome(); else renderCategory();

  $('#footText').textContent = state.shizuku==='connected'
    ? 'Shizuku conectado · 3 operaciones disponibles'
    : 'Shizuku ' + shizukuLabel().toLowerCase() + ' · las acciones SHIZUKU están limitadas';
  document.querySelectorAll('.pill[data-view]').forEach(b=>b.classList.toggle('on', Number(b.dataset.view)===state.category));
  $('#shizukuSel').value = state.shizuku;
  $('#oemToggle').checked = state.oem;
  applyFocus();
  renderSpecs();
}

function renderRail(){
  railEl.innerHTML = CATS.map((c,i)=>`
    <button class="rail-item ${i===state.category?'sel':''}" data-rail="${i}">
      ${ico(c.icon)}<span>${c.label}</span>
      ${c.badge && state.oem ? `<span class="rail-badge">${c.badge}</span>`:''}
    </button>`).join('');
  railEl.querySelectorAll('[data-rail]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.category = Number(el.dataset.rail);
      state.contentIndex = 0; state.detailIndex = 0; state.zone='content';
      render(); animateView();
    });
  });
}

function animateView(){ contentEl.classList.remove('view-in'); void contentEl.offsetWidth; contentEl.classList.add('view-in'); }

function chip(iconName,label,color){
  return `<div class="chip">${ico(iconName)}<span>${label}</span></div>`;
}

function renderHome(){
  const chips = [
    chip('wifi','Wi-Fi · Conectado','var(--green)'),
    chip('drive','4.2 GB libres','var(--blue)'),
    chip('shield','Shizuku · '+shizukuLabel(), shizukuColor())
  ];
  if(state.oem) chips.push(chip('tv','Modo proyector','var(--amber)'));

  contentEl.innerHTML = `
    <div class="chips">${chips.join('')}</div>
    <div class="section">Del sistema <span class="line"></span></div>
    <div class="grid-sys">
      ${HOME_CARDS.map((c,i)=>`
        <button class="card" data-card="${i}">
          <div class="icbox" style="background:color-mix(in srgb,${c.color} 15%,transparent);color:${c.color}">${ico(c.icon)}</div>
          <div><h3>${c.title}</h3><p>${c.sub}</p></div>
          <span class="b">${badge(c.origin)}</span>
          <span class="chev">${ico('chev')}</span>
        </button>`).join('')}
    </div>
    <div class="section">Del launcher <span class="line"></span></div>
    <div class="grid-own">
      ${OWN_CARDS.map((c,i)=>`
        <button class="card" data-own="${i}">
          <div class="icbox" style="background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)">${ico(c.icon)}</div>
          <div><h3>${c.title}</h3><p>${c.sub}</p></div>
          <span class="b">${badge(c.origin)}</span>
          <span class="chev">${ico('chev')}</span>
        </button>`).join('')}
    </div>`;

  state.rows = [...contentEl.querySelectorAll('[data-card]'), ...contentEl.querySelectorAll('[data-own]')];
  state.rows.forEach((el,i)=>{
    el.dataset.index = i;
    el.addEventListener('click', ()=>{ state.zone='content'; state.contentIndex=i; applyFocus(); activateHome(i); });
  });
  detailEl.classList.add('hidden');
}

function renderCategory(){
  state.rows = [];
  const data = DATA[CATS[state.category].id];
  let groups = data.groups;
  if(state.category===6 && !state.oem) groups = groups.filter(g=>!g.oem);

  const html = groups.map((g)=>{
    const rows = g.rows.map((r,ri)=>{
      const idx = state.rows.length;
      state.rows.push(null);
      const status = rowStatus(r);
      return `
        <button class="row" data-row="${idx}">
          <div class="icbox" style="background:color-mix(in srgb,${C[r.origin]} 15%,transparent);color:${C[r.origin]}">${ico(r.icon)}</div>
          <div><h4>${r.title}</h4><p>${status || r.sub}</p></div>
          <span class="b">${badge(r.origin)}</span>
          <span class="chev">${ico('chev')}</span>
        </button>`;
    }).join('');
    return `<div class="section" style="margin-top:${state.rows.length?'28':'0'}px">${g.label} <span class="line"></span></div>${rows}`;
  }).join('');

  contentEl.innerHTML = `<div class="cat"><div class="list">${html}
    ${state.category===6 && !state.oem ? '<div class="note">Sección OEM oculta: no se detectó una app de proyector en este equipo. El hub no muestra accesos que no resuelven.</div>':''}
    ${state.category===6 && state.oem ? '<div class="note">Las filas OEM abren la app del fabricante. Si no existe en el equipo, se ocultan automáticamente.</div>':''}
  </div></div>`;

  state.rows = [...contentEl.querySelectorAll('[data-row]')];
  state.contentIndex = Math.max(0, Math.min(state.contentIndex, state.rows.length-1));
  state.rows.forEach((el,i)=>{
    el.addEventListener('click', ()=>{ state.zone='content'; state.contentIndex=i; applyFocus(); activateRow(i); });
  });

  detailEl.classList.remove('hidden');
  renderDetail();
}

function rowStatus(r){
  if(r.origin===SHI){
    if(state.shizuku==='missing') return 'Shizuku no instalado · toca para ver opciones';
    if(state.shizuku==='unauthorized') return 'Shizuku sin autorizar · toca para autorizar';
    if(r.op==='anim') return state.applied ? 'Aplicado · 0.5× en las tres escalas' : r.sub;
  }
  return null;
}

function currentRow(){
  const data = DATA[CATS[state.category].id];
  let groups = data.groups;
  if(state.category===6 && !state.oem) groups = groups.filter(g=>!g.oem);
  const flat = groups.flatMap(g=>g.rows);
  return flat[state.contentIndex] || flat[0];
}

function renderDetail(){
  if(state.category===0){ detailEl.classList.add('hidden'); return; }
  detailEl.classList.remove('hidden');

  if(state.category===6 && state.shizuku!=='connected'){
    detailEl.innerHTML = `
      <div class="icbox" style="background:color-mix(in srgb,var(--purple) 16%,transparent);color:var(--purple)">${ico('shield')}</div>
      <h3>${state.shizuku==='missing'?'Shizuku no está instalado':'Shizuku sin autorizar'}</h3>
      <p class="desc">Las acciones marcadas SHIZUKU necesitan autorización. Sin ella, el launcher y los accesos SISTEMA siguen funcionando.</p>
      <div class="notice">${ico('info')} No se necesita root ni desbloquear el proyector.</div>
      <div class="grow"></div>
      <button class="btn primary" data-action="auth">${state.shizuku==='missing'?'Instalar Shizuku':'Autorizar Shizuku'}</button>
      <button class="btn ghost" data-action="adb">Ver instrucciones ADB</button>
      <div class="hintline">Si Shizuku no está instalado, el comando ADB se copia al portapapeles.</div>`;
    bindDetailActions();
    return;
  }

  const r = currentRow();
  if(!r) return;
  const d = r.detail;
  const values = (d.values||[]).map(([k,v])=>`<div class="kv"><span>${esc(k)}</span><span>${esc(v)}</span></div>`).join('');
  const bullets = (d.bullets||[]).map(b=>`<li>${esc(b)}</li>`).join('');
  const ctaLabel = r.origin===SHI && state.shizuku!=='connected' ? 'Conectar Shizuku'
    : r.origin===SHI && r.op==='anim' && state.applied ? 'Restaurar animaciones'
    : d.cta;

  detailEl.innerHTML = `
    <div class="icbox" style="background:color-mix(in srgb,${C[r.origin]} 16%,transparent);color:${C[r.origin]}">${ico(r.icon)}</div>
    <h3>${esc(r.title)}</h3>
    <span class="b">${badge(r.origin)}</span>
    <p class="desc">${esc(d.desc)}</p>
    ${values?`<div class="rule"></div><div class="kicker">Valor actual</div>${values}`:''}
    <div class="rule"></div>
    <div class="kicker">Qué puedes hacer desde aquí</div>
    <ul class="bullets">${bullets}</ul>
    <div class="grow"></div>
    <button class="btn primary" data-action="primary">${ctaLabel}</button>
    ${r.origin===OWN?'<button class="btn ghost" data-action="secondary">Ver opciones del launcher</button>':''}
    <div class="hintline">Atrás vuelve a este panel</div>`;
  bindDetailActions();
}

function bindDetailActions(){
  detailEl.querySelectorAll('[data-action]').forEach((el,i)=>{
    el.dataset.detailIndex = i;
    el.addEventListener('click', ()=>{ state.zone='detail'; state.detailIndex=i; applyFocus(); activateDetail(); });
  });
  state.actions = [...detailEl.querySelectorAll('[data-action]')];
}

/* ------------------------------------------------------------------ */
/*  Foco                                                              */
/* ------------------------------------------------------------------ */
function applyFocus(){
  document.querySelectorAll('.foc').forEach(e=>e.classList.remove('foc'));
  if(state.zone==='rail'){
    const el = railEl.querySelector(`[data-rail="${state.railIndex}"]`);
    if(el) el.classList.add('foc');
  } else if(state.zone==='content'){
    const el = state.rows[state.contentIndex];
    if(el) el.classList.add('foc');
    if(state.category!==0) renderDetail();
  } else if(state.zone==='detail'){
    const el = state.actions[state.detailIndex];
    if(el) el.classList.add('foc');
  }
}

/* ------------------------------------------------------------------ */
/*  Navegación                                                        */
/* ------------------------------------------------------------------ */
function goCategory(i){
  state.category = i; state.railIndex = i; state.contentIndex = 0; state.detailIndex = 0;
  state.zone = i===0 ? 'rail' : 'content';
  render(); animateView();
}

function moveRail(dir){
  state.railIndex = (state.railIndex + dir + CATS.length) % CATS.length;
  state.category = state.railIndex;
  state.contentIndex = 0; state.detailIndex = 0;
  render(); animateView();
}

function moveContent(dir){
  if(state.rows.length===0) return;
  if(state.category===0){
    const n = state.rows.length;
    if(dir==='left'||dir==='right'){
      const d = dir==='left'?-1:1;
      state.contentIndex = (state.contentIndex + d + n) % n;
    } else if(dir==='down'){
      state.contentIndex = state.contentIndex < 4 ? Math.min(3, state.contentIndex+2) : 4 + Math.min(2, (state.contentIndex-4+1)%3);
    } else {
      state.contentIndex = state.contentIndex>=4 ? 2 : Math.max(0, state.contentIndex-2);
    }
  } else {
    const d = (dir==='up'||dir==='left') ? -1 : 1;
    state.contentIndex = Math.max(0, Math.min(state.rows.length-1, state.contentIndex + d));
  }
  applyFocus();
}

function moveDetail(dir){
  const n = state.actions.length;
  if(n===0) return;
  state.detailIndex = (state.detailIndex + (dir==='up'?-1:1) + n) % n;
  applyFocus();
}

function activateHome(i){
  const sysCard = i<4 ? HOME_CARDS[i] : null;
  if(sysCard && sysCard.go!==null){ goCategory(sysCard.go); return; }
  const c = OWN_CARDS[i-4];
  openLauncher(c.title);
}

function activateRow(i){
  const r = currentRow();
  if(!r) return;
  if(r.origin===SYS) openSystemPanel(r.panel || 'system', r.title);
  else if(r.origin===OEM) openOem(r);
  else if(r.origin===SHI) openShizuku(r);
  else openLauncher(r.title);
}

function activateDetail(){
  if(state.category===6 && state.shizuku!=='connected' && state.zone==='detail'){
    const el = state.actions[state.detailIndex];
    if(el && el.dataset.action==='auth'){ openAuth(); return; }
    if(el && el.dataset.action==='adb'){ openAdb(); return; }
  }
  const r = currentRow();
  if(!r) return;
  if(r.origin===SYS) openSystemPanel(r.panel || 'system', r.title);
  else if(r.origin===OEM) openOem(r);
  else if(r.origin===SHI) openShizuku(r);
  else openLauncher(r.title);
}

function openModal(html, wide=false){
  modalEl.className = 'modal' + (wide?' wide':'');
  modalEl.innerHTML = html;
  modalLayer.classList.add('open');
  state.modal = true;
}
function closeModal(){
  modalLayer.classList.remove('open');
  state.modal = false;
  modalEl.innerHTML = '';
}
modalLayer.addEventListener('click', e=>{ if(e.target===modalLayer) closeModal(); });

function modalHead(iconName, color, title, sub){
  return `<div class="modal-head">
    <div class="icbox" style="background:color-mix(in srgb,${color} 16%,transparent);color:${color}">${ico(iconName)}</div>
    <div><h2>${esc(title)}</h2>${sub?`<p>${esc(sub)}</p>`:''}</div>
    <button class="x" data-close>${ico('x')}</button>
  </div>`;
}

function openSystemPanel(key, title){
  const p = PANELS[key] || PANELS.system;
  const rows = p.rows.map(([i,name,val])=>`<div class="sysrow">${ico(i)}<span>${esc(name)}</span><b>${esc(val)}</b>${ico('chev')}</div>`).join('');
  openModal(`
    ${modalHead('gear','var(--blue)','Ajustes del sistema', p.title)}
    <div class="modal-body">
      <div class="notice" style="margin:0 0 18px">Esta es una pantalla real de <b>com.android.tv.settings</b> abierta por <b>Intent</b>. El hub permanece detrás, en la misma tarea.</div>
      ${rows}
    </div>
    <div class="modal-foot">
      <button class="btn ghost" data-close style="margin:0">Atrás</button>
      <button class="btn primary" data-close style="margin:0">Volver al hub</button>
    </div>`, true);
  bindClose();
}

function openOem(r){
  const val = r.screen==='keystone' ? 0 : r.screen==='focus' ? 42 : 100;
  openModal(`
    ${modalHead(r.icon,'var(--amber)','App del fabricante', r.title)}
    <div class="modal-body">
      <div class="notice" style="margin:0">Pantalla de la app OEM del proyector. El hub no reimplementa este ajuste: lo delega.</div>
      <div class="sliderbox">
        <label><span>${esc(r.title)}</span><b id="sliderVal">${val}${r.screen==='focus'?' %':''}</b></label>
        <input type="range" id="slider" min="0" max="100" value="${val}">
      </div>
      <div class="notice">Si la app del fabricante no estuviera instalada, esta fila no se mostraría.</div>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" data-close style="margin:0">Cancelar</button>
      <button class="btn primary" id="oemApply" style="margin:0">Aplicar</button>
    </div>`, false);
  bindClose();
  const s = $('#slider'), v = $('#sliderVal');
  s.addEventListener('input', ()=>{ v.textContent = s.value + (r.screen==='focus'?' %':''); });
  $('#oemApply').addEventListener('click', ()=>{ closeModal(); showToast('Cambio aplicado en la app del fabricante'); });
}

function openShizuku(r){
  if(state.shizuku!=='connected'){ openAuth(); return; }
  if(r.op==='remove'){
    openModal(`
      ${modalHead('trash','var(--purple)','Quitar apps preinstaladas','Selecciona apps para retirar solo de este usuario')}
      <div class="modal-body">
        <div class="sysrow">${ico('grid')}<span>Play Games</span><b>Preinstalada</b><span style="margin-left:14px;color:var(--purple)">Quitar</span></div>
        <div class="sysrow">${ico('grid')}<span>YouTube Music</span><b>Preinstalada</b><span style="margin-left:14px;color:var(--purple)">Quitar</span></div>
        <div class="sysrow">${ico('grid')}<span>TV Settings</span><b>Protegida</b><span style="margin-left:14px;color:var(--dim)">No disponible</span></div>
        <div class="notice">El APK del sistema se conserva; se puede restaurar después.</div>
      </div>
      <div class="modal-foot">
        <button class="btn ghost" data-close style="margin:0">Cancelar</button>
        <button class="btn primary" id="shiApply" style="margin:0">Continuar</button>
      </div>`, false);
    bindClose();
    $('#shiApply').addEventListener('click', ()=>{ closeModal(); showToast('Se abriría la confirmación de Shizuku'); });
    return;
  }
  if(r.op==='restoreApps'){
    closeModal(); showToast('Restaurando apps del sistema con Shizuku…'); return;
  }
  if(r.op==='restore'){
    closeModal(); state.applied=false; render(); showToast('Escalas de animación restauradas'); return;
  }
  const applying = !state.applied;
  openModal(`
    ${modalHead('bolt','var(--purple)','Ejecutar con Shizuku', 'Animaciones del sistema')}
    <div class="modal-body">
      <div class="kicker">VALORES ACTUALES</div>
      <div class="kv"><span>window_animation_scale</span><span>1.0×</span></div>
      <div class="kv"><span>transition_animation_scale</span><span>1.0×</span></div>
      <div class="kv"><span>animator_duration_scale</span><span>1.0×</span></div>
      <div class="notice">${applying
        ? 'Se guardará un snapshot y se aplicarán 0.5× a las tres escalas. Podrás restaurarlas.'
        : 'Se restaurarán los valores guardados en el snapshot.'}</div>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" data-close style="margin:0">Cancelar</button>
      <button class="btn primary" id="shiApply" style="margin:0">${applying?'Aplicar 0.5×':'Restaurar'}</button>
    </div>`, false);
  bindClose();
  $('#shiApply').addEventListener('click', ()=>{
    closeModal(); state.applied = applying; state.contentIndex = 0; render();
    showToast(applying ? 'Animaciones 0.5× aplicadas' : 'Escalas restauradas');
  });
}

function openAuth(){
  const missing = state.shizuku==='missing';
  openModal(`
    ${modalHead('shield','var(--purple)', missing?'Instalar Shizuku':'Autorizar Shizuku', 'Permisos de shell sin root')}
    <div class="modal-body">
      <p class="desc" style="margin-top:0">${missing
        ? 'Shizuku no está instalado. Instálalo desde la tienda o el APK oficial y vuelve a este panel.'
        : 'Shizuku está instalado pero esta app no tiene permiso. Al autorizar, las acciones SHIZUKU se habilitan.'}</p>
      <div class="notice">No se necesita root. La autorización se concede una vez y se puede revocar.</div>
      <div class="code">adb shell sh /storage/emulated/0/Android/data/moe.shizuku.privileged.api/start.sh</div>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" data-close style="margin:0">Cancelar</button>
      <button class="btn primary" id="authSim" style="margin:0">${missing?'Simular instalación':'Simular autorización'}</button>
    </div>`, false);
  bindClose();
  $('#authSim').addEventListener('click', ()=>{
    closeModal(); state.shizuku='connected'; render(); showToast('Shizuku conectado y autorizado');
  });
}

function openLauncher(title){
  openModal(`
    ${modalHead('palette','var(--accent)', title, 'Ajuste propio del launcher')}
    <div class="modal-body">
      <p class="desc" style="margin-top:0">Este ajuste no sale del launcher: se aplica al instante y se guarda en el dispositivo.</p>
      <div class="notice">Se abriría la pantalla de Personalización existente, sin permisos del sistema.</div>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" data-close style="margin:0">Cerrar</button>
      <button class="btn primary" id="ownOpen" style="margin:0">Abrir Personalización</button>
    </div>`, false);
  bindClose();
  $('#ownOpen').addEventListener('click', ()=>{ closeModal(); showToast('Se abriría Personalización'); });
}

function openAdb(){
  openModal(`
    ${modalHead('copy','var(--accent)','Instrucciones ADB','Aplicar los ajustes desde un ordenador')}
    <div class="modal-body">
      <div class="code">adb connect 192.168.1.24:5555
adb shell settings put global window_animation_scale 0.5
adb shell settings put global transition_animation_scale 0.5
adb shell settings put global animator_duration_scale 0.5</div>
      <div class="notice">Restaurar: repite los comandos con el valor 1.0. No requiere root.</div>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" data-close style="margin:0">Cerrar</button>
      <button class="btn primary" id="copyAdb" style="margin:0">Copiar comandos</button>
    </div>`, false);
  bindClose();
  $('#copyAdb').addEventListener('click', ()=>{
    const txt = 'adb shell settings put global window_animation_scale 0.5\nadb shell settings put global transition_animation_scale 0.5\nadb shell settings put global animator_duration_scale 0.5';
    navigator.clipboard?.writeText(txt).catch(()=>{});
    showToast('Comandos copiados');
  });
}

function bindClose(){
  modalEl.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click', closeModal));
}

/* ------------------------------------------------------------------ */
/*  Especificaciones                                                  */
/* ------------------------------------------------------------------ */
function renderSpecs(){
  if(!state.specs){ specsEl.classList.remove('show'); specsEl.innerHTML=''; return; }
  specsEl.classList.add('show');
  const items = [
    [0,0,1920,1080,'Margen 64'],
    [64,196,300,620,'Rail 300'],
  ];
  if(state.category===0){
    items.push([400,324,716,168,'Tarjeta 716 × 168']);
    items.push([1140,324,716,168,'Gap 24']);
    items.push([400,768,468,160,'Tarjeta 468 × 160']);
  } else {
    items.push([400,232,880,76,'Fila 880 × 76']);
    items.push([1320,200,536,700,'Panel 536']);
  }
  specsEl.innerHTML = items.map(([x,y,w,h,l])=>`<div class="spec" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"><b>${l}</b></div>`).join('');
}

/* ------------------------------------------------------------------ */
/*  Teclado                                                           */
/* ------------------------------------------------------------------ */
document.addEventListener('keydown', e=>{
  const k = e.key;
  if(state.modal){
    if(k==='Escape'||k==='Backspace'){ e.preventDefault(); closeModal(); }
    if(k==='Enter'){ const b = modalEl.querySelector('.btn.primary'); if(b){ e.preventDefault(); b.click(); } }
    return;
  }
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(k)) e.preventDefault();

  if(state.zone==='rail'){
    if(k==='ArrowUp') moveRail(-1);
    else if(k==='ArrowDown') moveRail(1);
    else if(k==='ArrowRight'||k==='Enter'){
      if(state.category===0){ state.zone='content'; state.contentIndex=0; applyFocus(); }
      else { state.zone='content'; state.contentIndex=0; applyFocus(); }
    }
    else if(k==='Escape'||k==='Backspace'){
      if(state.category!==0) goCategory(0);
      else showToast('El hub se cerraría y volverías al launcher');
    }
    return;
  }

  if(state.zone==='content'){
    if(k==='ArrowLeft' && state.category!==0){ state.zone='rail'; state.railIndex=state.category; applyFocus(); return; }
    if(k==='ArrowUp'||k==='ArrowDown'||k==='ArrowLeft'||k==='ArrowRight'){
      const dir = k==='ArrowUp'?'up':k==='ArrowDown'?'down':k==='ArrowLeft'?'left':'right';
      moveContent(dir); return;
    }
    if(k==='Enter'){ if(state.category===0) activateHome(state.contentIndex); else activateRow(state.contentIndex); return; }
    if(k==='Escape'||k==='Backspace'){ state.zone='rail'; state.railIndex=state.category; applyFocus(); return; }
  }

  if(state.zone==='detail'){
    if(k==='ArrowUp'||k==='ArrowDown'){ moveDetail(k==='ArrowUp'?'up':'down'); return; }
    if(k==='ArrowLeft'||k==='Escape'||k==='Backspace'){ state.zone='content'; applyFocus(); return; }
    if(k==='Enter'){ activateDetail(); return; }
  }
});

/* ------------------------------------------------------------------ */
/*  Toolbar                                                           */
/* ------------------------------------------------------------------ */
document.querySelectorAll('.pill[data-view]').forEach(b=>{
  b.addEventListener('click', ()=>{
    const i = Number(b.dataset.view);
    goCategory(i);
    state.zone = i===0 ? 'rail' : 'content';
    applyFocus();
  });
});
$('#shizukuSel').addEventListener('change', e=>{ state.shizuku = e.target.value; render(); });
$('#oemToggle').addEventListener('change', e=>{ state.oem = e.target.checked; render(); });
$('#specsToggle').addEventListener('change', e=>{ state.specs = e.target.checked; renderSpecs(); });
$('#closeBtn').addEventListener('click', ()=> showToast('El hub se cerraría y volverías al launcher'));
$('#helpBtn').addEventListener('click', openHelp);

const ACCENTS = ['#37d9c5','#4fc3f7','#bb86fc','#ffb74d'];
$('#swatches').innerHTML = ACCENTS.map(h=>`<button class="swatch ${h===state.accent?'on':''}" data-hex="${h}" style="background:${h}" title="${h}"></button>`).join('');
document.querySelectorAll('.swatch').forEach(s=>s.addEventListener('click', ()=>setAccent(s.dataset.hex, s)));

function openHelp(){
  openModal(`
    ${modalHead('info','var(--accent)','Cómo usar el prototipo','Teclado, estados y badges')}
    <div class="modal-body">
      <div class="kicker">TECLADO</div>
      <div class="kv"><span>↑ ↓ ← →</span><span>Mover el foco</span></div>
      <div class="kv"><span>Enter</span><span>Abrir / ejecutar</span></div>
      <div class="kv"><span>Esc / Retroceso</span><span>Volver</span></div>
      <div class="rule" style="height:1px;background:#ffffff12;margin:20px 0"></div>
      <div class="kicker">BADGES</div>
      <div class="kv"><span>${badge('PROPIO')}</span><span>Se aplica en el launcher</span></div>
      <div class="kv"><span>${badge('SISTEMA')}</span><span>Abre un panel del sistema por Intent</span></div>
      <div class="kv"><span>${badge('SHIZUKU')}</span><span>Requiere autorización de Shizuku</span></div>
      <div class="kv"><span>${badge('OEM')}</span><span>Abre la app del fabricante</span></div>
      <div class="notice">Usa la barra superior para simular Shizuku, ocultar la app OEM o mostrar las medidas.</div>
    </div>
    <div class="modal-foot"><button class="btn primary" data-close style="margin:0">Entendido</button></div>`, false);
  bindClose();
}

/* ------------------------------------------------------------------ */
/*  Escalado y arranque                                               */
/* ------------------------------------------------------------------ */
function fit(){
  const stage = $('#stage');
  const s = Math.min((stage.clientWidth-40)/1920, (stage.clientHeight-40)/1080);
  $('#scaler').style.transform = `scale(${s})`;
}
window.addEventListener('resize', fit);

setAccent(state.accent);
fit();
render();
state.zone = 'rail'; state.railIndex = 0; applyFocus();
</script>
