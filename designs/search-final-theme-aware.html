<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buscador final · Base + Propuesta 3</title>
  <style>
    :root {
      --bar-accent: #8AB4F8;
      --bar-text: #F2F4F7;
      --bar-muted: #9AA7B4;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; min-height: 100%; }

    body {
      display: grid;
      min-height: 100vh;
      place-items: center;
      background: #0a0a0d;
      color: var(--bar-text);
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    button { font: inherit; color: inherit; }

    .prototype { width: min(1400px, 96vw); padding: 18px 0 24px; }

    .prototype-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 0 4px 14px;
    }

    .prototype-title { display: grid; gap: 2px; margin-right: 8px; }
    .prototype-title strong { font-size: 14px; letter-spacing: -.01em; }
    .prototype-title span { color: #8b8f9c; font-size: 11px; }

    .group {
      display: flex;
      gap: 4px;
      padding: 4px;
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 11px;
      background: rgba(255,255,255,.04);
    }

    .group button {
      min-height: 30px;
      padding: 0 11px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #a9adba;
      cursor: pointer;
      font-size: 11px;
      font-weight: 650;
    }

    .group button[aria-pressed="true"] { background: var(--bar-accent); color: #0a0a0d; }
    .group button:focus-visible { outline: 2px solid var(--bar-accent); outline-offset: 2px; }

    #keyboard-toggle {
      min-height: 38px;
      margin-left: auto;
      padding: 0 14px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 10px;
      background: rgba(255,255,255,.05);
      color: #cfd2db;
      cursor: pointer;
      font-size: 11px;
      font-weight: 650;
    }

    #keyboard-toggle[aria-pressed="true"] {
      border-color: var(--bar-accent);
      background: color-mix(in srgb, var(--bar-accent) 18%, transparent);
      color: var(--bar-text);
    }

    .tv-stage {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 12px;
      background: #000;
      box-shadow: 0 30px 90px rgba(0,0,0,.5);
    }

    #preview {
      position: absolute;
      top: 0;
      left: 0;
      width: 960px;
      height: 540px;
      border: 0;
      transform-origin: top left;
      background: #000;
    }

    @media (max-width: 980px) {
      .prototype-title { display: none; }
      #keyboard-toggle { margin-left: 0; }
    }
  </style>
</head>
<body>
  <div class="prototype">
    <div class="prototype-bar">
      <div class="prototype-title">
        <strong>Buscador final · Base + Propuesta 3</strong>
        <span>Roku y Apple: Propuesta 3 (Foco) · resto: Base sin teclado · teclado opcional</span>
      </div>
      <div class="group" aria-label="Selector de tema">
        <button type="button" data-theme="webos" aria-pressed="true">webOS</button>
        <button type="button" data-theme="fire" aria-pressed="false">Fire TV</button>
        <button type="button" data-theme="roku" aria-pressed="false">Roku</button>
        <button type="button" data-theme="tizen" aria-pressed="false">Tizen</button>
        <button type="button" data-theme="android" aria-pressed="false">Android TV</button>
        <button type="button" data-theme="google" aria-pressed="false">Google TV</button>
        <button type="button" data-theme="apple" aria-pressed="false">Apple TV</button>
      </div>
      <button type="button" id="keyboard-toggle" aria-pressed="false">Teclado en pantalla: off</button>
    </div>

    <div class="tv-stage">
      <iframe id="preview" title="Vista previa del buscador" src="about:blank"></iframe>
    </div>
  </div>

  <script>
    const THEMES = {
      webos: 'webOS', fire: 'Fire TV', roku: 'Roku', tizen: 'Tizen',
      android: 'Android TV', google: 'Google TV', apple: 'Apple TV'
    };
    const FOCUS_THEMES = new Set(['roku', 'apple']);

    const iframe = document.getElementById('preview');
    const keyboardToggle = document.getElementById('keyboard-toggle');
    const stage = document.querySelector('.tv-stage');

    let theme = 'webos';
    let keyboard = false;
    let keyboardUserSet = false;

    function previewSource() {
      const focus = FOCUS_THEMES.has(theme);
      const file = focus ? 'search-theme-aware.html' : 'search-base-theme-aware.html';
      const proposal = focus ? '&proposal=focus' : '';
      return `${file}?theme=${theme}${proposal}&keyboard=${keyboard ? 1 : 0}&embed=1`;
    }

    function render() {
      document.querySelectorAll('button[data-theme]').forEach((button) => {
        button.setAttribute('aria-pressed', String(button.dataset.theme === theme));
      });
      keyboardToggle.setAttribute('aria-pressed', String(keyboard));
      keyboardToggle.textContent = `Teclado en pantalla: ${keyboard ? 'on' : 'off'}`;

      const source = previewSource();
      if (iframe.getAttribute('src') !== source) iframe.src = source;
    }

    function setTheme(nextTheme) {
      if (!THEMES[nextTheme]) return;
      theme = nextTheme;
      render();
    }

    function setKeyboard(enabled) {
      keyboard = enabled;
      keyboardUserSet = true;
      render();
    }

    function fitFrame() {
      iframe.style.transform = `scale(${stage.clientWidth / 960})`;
    }

    document.addEventListener('click', (event) => {
      const themeButton = event.target.closest('button[data-theme]');
      if (themeButton) { setTheme(themeButton.dataset.theme); return; }
    });

    keyboardToggle.addEventListener('click', () => setKeyboard(!keyboard));
    window.addEventListener('resize', fitFrame);

    window.addEventListener('load', () => {
      const params = new URLSearchParams(window.location.search);
      const requestedTheme = params.get('theme');
      if (THEMES[requestedTheme]) theme = requestedTheme;

      if (params.has('keyboard')) {
        keyboardUserSet = true;
        keyboard = params.get('keyboard') === '1' || params.get('keyboard') === 'on';
      }

      fitFrame();
      render();
    });
  </script>
</body>
</html>
