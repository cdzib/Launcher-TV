<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Base actual · Buscar y apps por tema</title>
  <style>
    :root {
      --bg: #08070D;
      --surface: #211A2B;
      --accent: #37D9C5;
      --text: #F2F4F7;
      --muted: #B4BCC8;
      --radius: 30px;
      --focus-scale: 1.10;
    }

    body[data-theme="webos"] {
      --bg: #08070D; --surface: #211A2B; --accent: #37D9C5;
      --text: #F2F4F7; --muted: #B4BCC8; --radius: 30px; --focus-scale: 1.10;
    }

    body[data-theme="fire"] {
      --bg: #111111; --surface: #242424; --accent: #53B8FF;
      --text: #F2F4F7; --muted: #9AA7B4; --radius: 12px; --focus-scale: 1.08;
    }

    body[data-theme="roku"] {
      --bg: #24103C; --surface: #361955; --accent: #FFFFFF;
      --text: #FFFFFF; --muted: #E5D4F5; --radius: 10px; --focus-scale: 1.06;
    }

    body[data-theme="tizen"] {
      --bg: #08090B; --surface: #17191D; --accent: #6B7BFF;
      --text: #F2F4F7; --muted: #B4BCC8; --radius: 28px; --focus-scale: 1.00;
    }

    body[data-theme="android"] {
      --bg: #071326; --surface: #17243A; --accent: #8AB4F8;
      --text: #F2F4F7; --muted: #B4BCC8; --radius: 16px; --focus-scale: 1.06;
    }

    body[data-theme="google"] {
      --bg: #101827; --surface: #1B2940; --accent: #A8C7FA;
      --text: #F2F4F7; --muted: #B4BCC8; --radius: 24px; --focus-scale: 1.10;
    }

    body[data-theme="apple"] {
      --bg: #090807; --surface: #30231B; --accent: #FFC078;
      --text: #F2F4F7; --muted: #B8ACA2; --radius: 16px; --focus-scale: 1.08;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; min-height: 100%; }

    body {
      display: grid;
      min-height: 100vh;
      place-items: center;
      background: #0a0a0d;
      color: var(--text);
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    button { font: inherit; color: inherit; }

    .prototype { width: min(1400px, 96vw); padding: 18px 0 24px; }

    .prototype-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 0 4px 14px;
    }

    .prototype-title { display: grid; gap: 2px; margin-right: 8px; }
    .prototype-title strong { font-size: 14px; letter-spacing: -.01em; }
    .prototype-title span { color: #8b8f9c; font-size: 11px; }

    .group {
      display: flex;
      gap: 4px;
      padding: 4px;
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 11px;
      background: rgba(255,255,255,.04);
    }

    .group button {
      min-height: 30px;
      padding: 0 11px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #a9adba;
      cursor: pointer;
      font-size: 11px;
      font-weight: 650;
    }

    .group button[aria-pressed="true"] { background: var(--accent); color: var(--bg); }
    .group button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    #keyboard-toggle {
      min-height: 38px;
      margin-left: auto;
      padding: 0 14px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 10px;
      background: rgba(255,255,255,.05);
      color: #cfd2db;
      cursor: pointer;
      font-size: 11px;
      font-weight: 650;
    }

    #keyboard-toggle[aria-pressed="true"] {
      border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 18%, transparent);
      color: var(--text);
    }

    .tv-stage { position: relative; width: 100%; aspect-ratio: 16 / 9; }

    .tv-frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 960px;
      height: 540px;
      overflow: hidden;
      transform-origin: top left;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 12px;
      background: var(--bg);
      box-shadow: 0 30px 90px rgba(0,0,0,.5);
    }

    .search-root {
      display: flex;
      height: 100%;
      background: linear-gradient(135deg, var(--bg), color-mix(in srgb, var(--surface) 82%, var(--bg)));
    }

    .side {
      display: flex;
      width: 72px;
      flex: none;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      padding: 24px 0;
      background: rgba(0,0,0,.16);
    }

    .brand { color: var(--text); font-size: 24px; font-weight: 700; letter-spacing: -.04em; }
    .side-spacer { flex: 1; }

    .icon-button {
      display: grid;
      width: 44px;
      height: 44px;
      place-items: center;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }

    .icon-button svg { width: 20px; height: 20px; }
    .icon-button.selected { background: var(--accent); color: var(--bg); }
    .icon-button:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }

    .content {
      display: flex;
      min-width: 0;
      flex: 1;
      min-height: 0;
      flex-direction: column;
      gap: 10px;
      padding: 26px 32px 20px;
    }

    .topbar {
      display: flex;
      flex: none;
      align-items: center;
      gap: 28px;
    }

    .title-block { display: grid; flex: none; gap: 2px; }
    .title-block h1 { font-size: 30px; }
    .title-block .subtitle { max-width: 280px; }

    h1 { margin: 0; font-size: 32px; font-weight: 650; letter-spacing: -.03em; }
    .subtitle { margin: 0; color: var(--muted); font-size: 13px; }

    .field {
      display: flex;
      min-width: 0;
      flex: 1;
      align-items: center;
      gap: 10px;
      min-height: 52px;
      padding: 0 8px 0 12px;
      border: 1px solid color-mix(in srgb, var(--muted) 24%, transparent);
      border-radius: 12px;
      background: var(--surface);
    }

    .field.focused {
      border-width: 2px;
      border-color: var(--accent);
      padding-left: 11px;
    }

    .field svg { width: 20px; height: 20px; flex: none; color: var(--muted); }

    .query-wrap { position: relative; display: flex; min-width: 0; flex: 1; align-items: center; }

    .query { overflow: hidden; color: var(--text); font-size: 16px; text-overflow: ellipsis; white-space: nowrap; }
    .placeholder { color: color-mix(in srgb, var(--muted) 80%, transparent); font-size: 14px; }
    .field.has-query .placeholder { display: none; }

    .clear {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }

    .clear svg { width: 16px; height: 16px; }
    .clear:focus-visible { outline: 2px solid var(--text); outline-offset: 1px; }

    .keyboard-panel {
      display: flex;
      flex: none;
      flex-direction: column;
      gap: 4px;
      padding-top: 2px;
    }

    .keys {
      display: grid;
      flex: none;
      grid-template-columns: repeat(13, minmax(0, 1fr));
      gap: 4px;
      align-content: start;
    }

    .key {
      min-height: 32px;
      border: 1px solid color-mix(in srgb, var(--muted) 20%, transparent);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }

    .key:focus-visible {
      outline: none;
      border: 2px solid var(--accent);
      background: var(--accent);
      color: var(--bg);
    }

    .key-row { display: flex; gap: 6px; }
    .key-row .key { min-height: 30px; flex: 1; font-size: 11px; }
    .key-row .key svg { width: 16px; height: 16px; }

    body.keyboard-off .keyboard-panel { display: none; }
    body:not(.keyboard-off) .hero,
    body:not(.keyboard-off) .right-head { display: none; }

    .right-head { display: flex; align-items: center; justify-content: space-between; }
    .right-head strong { font-size: 16px; font-weight: 650; }
    .right-head span { color: var(--muted); font-size: 14px; }

    .hero {
      display: flex;
      height: 72px;
      flex: none;
      align-items: center;
      gap: 14px;
      padding: 10px 18px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 16px;
      background: linear-gradient(120deg, color-mix(in srgb, var(--surface) 68%, var(--bg)), var(--surface));
    }

    .hero-top { display: flex; flex: none; align-items: center; gap: 10px; }
    .hero-icon { display: grid; width: 38px; height: 38px; place-items: center; border-radius: 10px; background: var(--app-color); }
    .hero-icon svg { width: 55%; height: 55%; color: #fff; }
    .hero-label { color: var(--muted); font-size: 11px; }
    .hero-name { flex: none; max-width: 32%; overflow: hidden; font-size: 19px; font-weight: 650; letter-spacing: -.02em; text-overflow: ellipsis; white-space: nowrap; }
    .hero-foot { display: flex; min-width: 0; flex: 1; align-items: center; justify-content: flex-end; gap: 14px; }
    .hero-note { min-width: 0; flex: 1; overflow: hidden; color: var(--muted); font-size: 12px; text-align: right; text-overflow: ellipsis; white-space: nowrap; }
    .hero .primary { min-height: 36px; font-size: 13px; }

    .primary {
      min-height: 44px;
      padding: 0 16px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: var(--accent);
      color: var(--bg);
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
    }

    .primary:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }

    .results {
      display: grid;
      min-height: 0;
      flex: 1;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 8px;
      align-content: start;
      overflow-y: auto;
      padding: 4px;
      scrollbar-width: none;
    }

    .results::-webkit-scrollbar { display: none; }

    .result {
      min-width: 0;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      text-align: center;
    }

    .result:focus-visible { outline: none; }

    .art {
      display: grid;
      width: 100%;
      height: 64px;
      place-items: center;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 12px;
      background: var(--surface);
      transition: transform 150ms ease, border-color 150ms ease, background 150ms ease;
    }

    .glyph {
      display: grid;
      width: 40px;
      height: 40px;
      place-items: center;
      border-radius: 10px;
    }

    .glyph svg { width: 62%; height: 62%; color: #fff; }

    .result .name {
      display: block;
      margin-top: 6px;
      overflow: hidden;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .result:focus-visible .art {
      border: 3px solid var(--accent);
      background: color-mix(in srgb, var(--surface) 88%, var(--text));
    }

    .result:focus-visible .name { color: var(--text); }

    .empty {
      grid-column: 1 / -1;
      display: grid;
      min-height: 120px;
      place-items: center;
      color: var(--muted);
      font-size: 14px;
      text-align: center;
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 12px;
    }

    .hint { display: flex; gap: 14px; }
    .keycap {
      display: inline-grid;
      min-width: 20px;
      height: 20px;
      place-items: center;
      margin-right: 5px;
      border: 1px solid color-mix(in srgb, var(--muted) 55%, transparent);
      border-radius: 5px;
      color: var(--text);
      font-size: 9px;
      font-weight: 750;
    }

    .toast {
      position: absolute;
      right: 26px;
      bottom: 26px;
      z-index: 20;
      padding: 10px 15px;
      border: 1px solid color-mix(in srgb, var(--accent) 60%, transparent);
      border-radius: 10px;
      background: color-mix(in srgb, var(--surface) 94%, black);
      color: var(--text);
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(12px);
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .toast.visible { opacity: 1; transform: translateY(0); }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
    }

    @media (max-width: 980px) {
      .prototype-title { display: none; }
      #keyboard-toggle { margin-left: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
    }

    body.embed { display: block; }
    body.embed .prototype { width: 100%; padding: 0; }
    body.embed .prototype-bar { display: none; }
    body.embed .tv-stage { height: 100vh; aspect-ratio: auto; }
    body.embed .tv-frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: none !important;
      border: 0;
      border-radius: 0;
      box-shadow: none;
    }
  </style>
</head>

  <div class="prototype">
    <div class="prototype-bar">
      <div class="prototype-title">
        <strong>Base actual · Buscar y apps</strong>
        <span>Misma pantalla de hoy, adaptada al tema activo</span>
      </div>
      <div class="group" aria-label="Selector de tema">
        <button type="button" data-theme="webos" aria-pressed="true">webOS</button>
        <button type="button" data-theme="fire" aria-pressed="false">Fire TV</button>
        <button type="button" data-theme="roku" aria-pressed="false">Roku</button>
        <button type="button" data-theme="tizen" aria-pressed="false">Tizen</button>
        <button type="button" data-theme="android" aria-pressed="false">Android TV</button>
        <button type="button" data-theme="google" aria-pressed="false">Google TV</button>
        <button type="button" data-theme="apple" aria-pressed="false">Apple TV</button>
      </div>
      <button type="button" id="keyboard-toggle" aria-pressed="false">Teclado en pantalla: off</button>
    </div>

    <div class="tv-stage">
      <main class="tv-frame" aria-label="Buscador actual adaptado al tema">
        <div class="search-root">
          <aside class="side" aria-label="Navegación del buscador">
            <span class="brand">st.</span>
            <span class="side-spacer"></span>
            <button class="icon-button tv-focus" type="button" data-message="Volver al inicio" aria-label="Volver al inicio">
              <svg><use href="#v-home"/></svg>
            </button>
            <button class="icon-button selected tv-focus" type="button" data-message="Buscar" aria-label="Buscar">
              <svg><use href="#v-search"/></svg>
            </button>
            <span class="side-spacer"></span>
            <button class="icon-button tv-focus" type="button" data-message="Cerrar" aria-label="Cerrar">
              <svg><use href="#v-back"/></svg>
            </button>
          </aside>

          <div class="content">
            <div class="topbar">
              <div class="title-block">
                <h1>Buscar</h1>
                <p class="subtitle">Escribe o usa la voz para encontrar tu app.</p>
              </div>

                <svg><use href="#v-search"/></svg>
                <div class="query-wrap">
                  <span class="query" id="query-text"></span>
                  <span class="placeholder">Escribe el nombre de una app</span>

                  <svg><use href="#v-mic"/></svg>

        <div class="toast" role="status" aria-live="polite"></div>

    </div>
  </div>

  <script>
    const APPS = [
      ['YouTube', '#e43c35', 'play'],
      ['Netflix', '#c91d32', 'play'],
      ['Música', '#b03e9d', 'music'],
      ['Prime Video', '#228bd0', 'play'],
      ['Fotos', '#d8477f', 'photo'],
      ['Moonlight', '#36a861', 'game'],
      ['Navegador', '#e68132', 'globe'],
      ['Disney+', '#3158bb', 'play'],
      ['Spotify', '#2ca865', 'music'],
      ['Archivos', '#4e9f7f', 'folder'],
      ['Max', '#6744d6', 'play'],
      ['Juegos', '#7654df', 'game'],
      ['Plex', '#c28a21', 'play'],
      ['Drive', '#3c9873', 'folder'],
      ['Crunchyroll', '#e96f20', 'play'],
      ['Galería', '#a8498d', 'photo'],
      ['Steam Link', '#31557f', 'game'],
      ['Radio', '#ad5278', 'music']
    ].map(([name, color, icon]) => ({ name, color, icon }));

    const THEME_NAMES = {
      webos: 'webOS', fire: 'Fire TV', roku: 'Roku', tizen: 'Tizen',
      android: 'Android TV', google: 'Google TV', apple: 'Apple TV'
    };

    const body = document.body;
    const resultsEl = document.getElementById('results');
    const heroEl = document.getElementById('hero');
    const queryTextEl = document.getElementById('query-text');
    const fieldEl = document.getElementById('field');
    const countEl = document.getElementById('result-count');
    const rightTitleEl = document.getElementById('right-title');
    const keysEl = document.getElementById('keys');
    const keyboardToggle = document.getElementById('keyboard-toggle');
    const toastEl = document.querySelector('.toast');

    let query = '';
    let toastTimer;

    function visibleApps() {
      const needle = query.trim().toLowerCase();
      return APPS.filter((app) => app.name.toLowerCase().includes(needle));
    }

    function iconMarkup(app) {
      return `<svg aria-hidden="true"><use href="#v-${app.icon}"/></svg>`;
    }

    function resultMarkup(app) {
      return `
        <button class="result tv-focus" type="button" data-app="${app.name}">
          <span class="art"><span class="glyph" style="background:${app.color}">${iconMarkup(app)}</span></span>
          <span class="name">${app.name}</span>
        </button>`;
    }

    function render() {
      const apps = visibleApps();
      resultsEl.innerHTML = apps.length
        ? apps.map(resultMarkup).join('')
        : '<p class="empty">No se encontraron aplicaciones.<br>Prueba con otro nombre o borra la búsqueda.</p>';
      queryTextEl.textContent = query;
      fieldEl.classList.toggle('has-query', query.length > 0);
      countEl.textContent = `${apps.length} apps`;
      rightTitleEl.textContent = query.trim() ? 'Resultados' : 'Aplicaciones instaladas';
      renderHero(apps[0]);
    }

    function renderHero(app) {
      if (!app) {
        heroEl.innerHTML = '<div class="hero-label">Sin resultados</div><div class="hero-name">Sin resultados</div><div class="hero-foot"><span class="hero-note">Prueba con otro nombre o borra la búsqueda.</span></div>';
        return;
      }
      heroEl.innerHTML = `
        <div class="hero-top">
          <span class="hero-icon" style="--app-color:${app.color}">${iconMarkup(app)}</span>
          <span class="hero-label">Seleccionada</span>
        </div>
        <div class="hero-name">${app.name}</div>
        <div class="hero-foot">
          <span class="hero-note">Lista para abrir en tu TV.</span>
          <button class="primary tv-focus" type="button" data-app="${app.name}">Abrir</button>
        </div>`;
    }

    function focusFirstResult() {
      const first = resultsEl.querySelector('.result');
      if (first) first.focus({ preventScroll: true });
      else fieldEl.focus({ preventScroll: true });
    }

    function setQuery(next, focusField = true) {
      query = next;
      render();
      if (focusField) fieldEl.focus({ preventScroll: true });
    }

    function showToast(message) {
      toastEl.textContent = message;
      toastEl.classList.add('visible');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('visible'), 1600);
    }

    function setTheme(theme) {
      body.dataset.theme = theme;
      document.querySelectorAll('button[data-theme]').forEach((button) => {
        button.setAttribute('aria-pressed', String(button.dataset.theme === theme));
      });
      requestAnimationFrame(focusFirstResult);
    }

    function setKeyboard(enabled) {
      body.classList.toggle('keyboard-off', !enabled);
      keyboardToggle.setAttribute('aria-pressed', String(enabled));
      keyboardToggle.textContent = `Teclado en pantalla: ${enabled ? 'on' : 'off'}`;
      requestAnimationFrame(focusFirstResult);
    }

    function moveFocus(direction) {
      const items = [...document.querySelectorAll('.tv-focus')].filter((item) => item.offsetParent !== null);
      const current = document.activeElement;
      if (!items.includes(current)) return;
      const source = current.getBoundingClientRect();
      const sx = source.left + source.width / 2;
      const sy = source.top + source.height / 2;
      let best;
      let bestScore = Infinity;

      items.forEach((candidate) => {
        if (candidate === current) return;
        const rect = candidate.getBoundingClientRect();
        const dx = rect.left + rect.width / 2 - sx;
        const dy = rect.top + rect.height / 2 - sy;
        const valid = direction === 'left' ? dx < -4 : direction === 'right' ? dx > 4 : direction === 'up' ? dy < -4 : dy > 4;
        if (!valid) return;
        const primary = direction === 'left' || direction === 'right' ? Math.abs(dx) : Math.abs(dy);
        const secondary = direction === 'left' || direction === 'right' ? Math.abs(dy) : Math.abs(dx);
        const score = primary + secondary * 2.5;
        if (score < bestScore) { best = candidate; bestScore = score; }
      });

      if (best) {
        best.focus({ preventScroll: true });
        best.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' });
      }
    }

    function buildKeyboard() {
      keysEl.innerHTML = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('')
        .map((letter) => `<button class="key tv-focus" type="button" data-key="${letter}">${letter}</button>`)
        .join('');
    }

    document.addEventListener('click', (event) => {
      const themeButton = event.target.closest('button[data-theme]');
      if (themeButton) { setTheme(themeButton.dataset.theme); return; }

      const key = event.target.closest('[data-key]');
      if (key) {
        if (key.dataset.key === '⌫') setQuery(query.slice(0, -1), false);
        else setQuery(query + key.dataset.key, false);
        return;
      }

      if (event.target.closest('#clear-button')) { setQuery(''); return; }

      const appButton = event.target.closest('[data-app]');
      if (appButton) { showToast(`Abrir ${appButton.dataset.app}`); return; }

      const messageButton = event.target.closest('[data-message]');
      if (messageButton) { showToast(messageButton.dataset.message); }
    });

    keyboardToggle.addEventListener('click', () => {
      setKeyboard(body.classList.contains('keyboard-off'));
    });

    document.addEventListener('keydown', (event) => {
      const directions = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' };
      if (directions[event.key] && document.activeElement.classList.contains('tv-focus')) {
        event.preventDefault();
        moveFocus(directions[event.key]);
        return;
      }

      if (event.key === 'Enter') {
        const active = document.activeElement;
        if (active.classList.contains('result') || active.dataset.app) {
          showToast(`Abrir ${active.dataset.app}`);
        } else if (query.trim()) {
          showToast(`Buscar “${query.trim()}”`);
        } else {
          focusFirstResult();
        }
        return;
      }

      if (event.key === 'Escape') {
        event.preventDefault();
        if (query) setQuery('');
        else showToast('Volver al inicio');
        return;
      }

      if (event.key === 'Backspace') {
        event.preventDefault();
        setQuery(query.slice(0, -1), false);
        return;
      }

      if (event.key.length === 1 && /[a-zA-Z0-9ñÑ ]/.test(event.key) && !event.ctrlKey && !event.metaKey && !event.altKey) {
        event.preventDefault();
        setQuery(query + event.key);
      }
    });

    function fitFrame() {
      const stage = document.querySelector('.tv-stage');
      const frame = document.querySelector('.tv-frame');
      if (!stage || !frame) return;
      frame.style.transform = `scale(${stage.clientWidth / 960})`;
    }

    function boot() {
      buildKeyboard();
      const params = new URLSearchParams(window.location.search);
      const requestedTheme = params.get('theme');
      const keyboardParam = params.get('keyboard');
      const embed = params.has('embed');

      if (embed) body.classList.add('embed');
      render();
      if (params.get('q')) { query = params.get('q'); render(); }
      setTheme(THEME_NAMES[requestedTheme] ? requestedTheme : 'webos');
      setKeyboard(keyboardParam === '1' || keyboardParam === 'on');
      if (!embed) {
        fitFrame();
        window.addEventListener('resize', fitFrame);
      }
      requestAnimationFrame(() => {
        const firstKey = keysEl.querySelector('.key');
        if (firstKey) firstKey.focus({ preventScroll: true });
      });
    }

    window.addEventListener('load', boot);
  </script>
</body>
</html>
