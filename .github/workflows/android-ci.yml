name: Android CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify module boundaries
        run: ./gradlew verifyModuleBoundaries

      - name: Run tests
        run: ./gradlew test testDebugUnitTest

      - name: Lint
        run: ./gradlew lintDebug

      - name: Build Debug and Release
        run: ./gradlew :app:assembleDebug :app:assembleRelease
